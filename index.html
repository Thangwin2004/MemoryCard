<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <title>Bộ Lạc Memory Match</title>
</head>

<body>
  <div id="app">

    <!-- User Profile Widget Overlay -->
    <div id="user-profile" class="user-profile-widget" style="display: none;">
      <img id="user-avatar" class="user-profile-avatar" src="" alt="Avatar" />
      <div class="user-profile-info">
        <span id="user-name" class="user-profile-name">Guest</span>
        <span id="user-status" class="user-profile-status">Đã đăng nhập</span>
      </div>
    </div>
    <!-- HTML Splash Screen -->
    <div id="splash-screen" style="position: absolute; top:0; left:0; width:100%; height:100%; background:#1a1a1a; display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:9999; transition: opacity 0.5s;">
      <div id="splash-text" style="color:#ffffff; font-family:'Be Vietnam Pro', Arial, sans-serif; font-size:36px; font-weight:bold; margin-bottom:20px;">Loading 0%</div>
      <div style="width:300px; height:20px; background:#333333; border-radius:10px; overflow:hidden;">
        <div id="splash-progress" style="width:0%; height:100%; background:#F57C00; transition: width 0.1s;"></div>
      </div>
    </div>

    <div id="pixi-container"></div>
  </div>
  <script src="/wink-bridge.js"></script>
    <script type="module" src="/src/main.js"></script>
</body>

</html>
