<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <title>Peanut Memory Match</title>
</head>

<body>
  <div id="app">

    <!-- User Profile Widget Overlay -->
    <div id="user-profile" class="user-profile-widget" style="display: none;">
      <img id="user-avatar" class="user-profile-avatar" src="" alt="Avatar" />
      <div class="user-profile-info">
        <span id="user-name" class="user-profile-name">Guest</span>
        <span id="user-status" class="user-profile-status">Signed in</span>
      </div>
    </div>
    <!-- HTML Splash Screen -->
    <div id="splash-screen" role="status" aria-live="polite">
      <img
        class="studio-splash-logo"
        src="/assest/Logo/PapaStudio_Logo_Full_Color.png.png"
        alt="PapaStudio"
      />
      <div id="splash-text" class="splash-loading-text">Loading 0%</div>
      <div class="splash-progress-track" aria-hidden="true">
        <div id="splash-progress" class="splash-progress-fill"></div>
      </div>
    </div>

    <div id="pixi-container"></div>
  </div>
  <script src="https://sdk.winkgames.fun/v1/wink.js"></script>
    <script type="module" src="/src/main.js"></script>
</body>

</html>
